name: CI and npm release

# Trigger policy:
#   - PRs run CI on code paths only (docs-only PRs skip the matrix).
#   - Pushes to `main` run CI once (PRs already validated the same diff).
#   - Case: tag pushes (v*) run CI + the npm release.
#   - `concurrency` cancels superseded runs so rapid pushes don't pile up.
on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
    paths:
      - 'agent-profile.mjs'
      - 'lib/**'
      - 'scripts/**'
      - 'profiles/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/**'
      - '.github/workflows.yml'
      - '.github/workflows.yaml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Test ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['18', '24']
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        # pnpm install is the network-heavy step most prone to transient
        # registry flakes; retry it without masking real test failures.
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: pnpm install --frozen-lockfile
      - name: Run test suite
        run: pnpm run test:all
      - name: Verify package manifest
        run: pnpm run verify:pack
      - name: Smoke test packed binary
        run: pnpm run smoke:packed

  release:
    name: Publish protected version tag
    needs: ci
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: npm-release
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.33.4
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate tag and npm registry state
        run: node scripts/release-verify.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish to npm with OIDC
        run: npm publish --access public
